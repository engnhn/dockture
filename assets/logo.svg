<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 180" width="100%" height="100%">
  <defs>
    <!-- Cloud Native Primary Gradient (Royal Cobalt Blue to Sky Blue to Vibrant Cyan) -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Pulse Waveform Gradient (Bright Cyan to Light Electric Blue) -->
    <linearGradient id="pulse-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Glow Filter for Pulse Accent -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Only (Icon Only, Fully Transparent Background) -->
  <g transform="translate(30, 20)">
    <!-- Outer Container Shield / Box Base -->
    <path d="M 20 20 L 140 20 C 151 20 160 29 160 40 L 160 120 C 160 131 151 140 140 140 L 20 140 C 9 140 0 131 0 120 L 0 40 C 0 29 9 20 20 20 Z" 
          fill="none" stroke="url(#primary-grad)" stroke-width="8" stroke-linejoin="round" />

    <!-- Container Top Ribs / Grooves -->
    <rect x="25" y="32" width="20" height="12" rx="3" fill="url(#primary-grad)" opacity="0.85"/>
    <rect x="55" y="32" width="20" height="12" rx="3" fill="url(#primary-grad)" opacity="0.85"/>
    <rect x="85" y="32" width="20" height="12" rx="3" fill="url(#primary-grad)" opacity="0.85"/>
    <rect x="115" y="32" width="20" height="12" rx="3" fill="url(#primary-grad)" opacity="0.85"/>

    <!-- Medical Pulse / Stethoscope Heartbeat Graph -->
    <path d="M -15 80 L 25 80 L 40 50 L 55 110 L 75 35 L 95 95 L 110 70 L 125 80 L 175 80" 
          fill="none" stroke="url(#pulse-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

    <!-- Health Indicator Status Node -->
    <circle cx="75" cy="35" r="5" fill="#38bdf8" filter="url(#glow)"/>
  </g>
</svg>
